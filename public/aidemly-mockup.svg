<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <clipPath id="back-clip">
      <rect x="163" y="0" width="357" height="270" rx="14"/>
    </clipPath>
    <clipPath id="front-clip">
      <rect x="0" y="152" width="357" height="280" rx="14"/>
    </clipPath>
    <clipPath id="drawer-clip">
      <rect x="347" y="206" width="170" height="190" rx="12"/>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- BACK WINDOW — Analytics (top-right)                -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="163" y="0" width="357" height="270" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" filter="url(#sh1)"/>

  <!-- TikTok Views card -->
  <rect x="174" y="11" width="164" height="148" rx="9" fill="white"/>
  <text x="184" y="26" font-size="8" fill="#6b7280" font-weight="500">TikTok Views</text>

  <!-- Donut chart — center (256,78), r=20, stroke-width=9, C≈125.66 -->
  <g transform="rotate(-90 256 78)">
    <!-- Alice 45% = 56.55 -->
    <circle cx="256" cy="78" r="20" fill="none" stroke="#1e3a8a" stroke-width="9" stroke-dasharray="56.55 125.66"/>
    <!-- Carol 30% = 37.70, offset=-56.55 -->
    <circle cx="256" cy="78" r="20" fill="none" stroke="#f59e0b" stroke-width="9" stroke-dasharray="37.70 125.66" stroke-dashoffset="-56.55"/>
    <!-- Bob 25% = 31.42, offset=-94.25 -->
    <circle cx="256" cy="78" r="20" fill="none" stroke="#06b6d4" stroke-width="9" stroke-dasharray="31.42 125.66" stroke-dashoffset="-94.25"/>
  </g>
  <!-- Donut center hole label -->
  <circle cx="256" cy="78" r="13" fill="white"/>
  <text x="256" y="81" text-anchor="middle" font-size="6.5" font-weight="700" fill="#374151">710K</text>

  <!-- Legend -->
  <circle cx="184" cy="109" r="3" fill="#1e3a8a"/>
  <text x="190" y="112" font-size="7" fill="#9ca3af">@alice</text>
  <text x="330" y="112" font-size="7" fill="#4b5563" font-weight="600" text-anchor="end">45%</text>
  <circle cx="184" cy="122" r="3" fill="#f59e0b"/>
  <text x="190" y="125" font-size="7" fill="#9ca3af">@carol</text>
  <text x="330" y="125" font-size="7" fill="#4b5563" font-weight="600" text-anchor="end">30%</text>
  <circle cx="184" cy="135" r="3" fill="#06b6d4"/>
  <text x="190" y="138" font-size="7" fill="#9ca3af">@bob</text>
  <text x="330" y="138" font-size="7" fill="#4b5563" font-weight="600" text-anchor="end">25%</text>

  <!-- Engagement card -->
  <rect x="344" y="11" width="165" height="148" rx="9" fill="white"/>
  <text x="354" y="26" font-size="8" fill="#6b7280" font-weight="500">Engagement</text>
  <!-- Grid lines -->
  <line x1="354" y1="50" x2="498" y2="50" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="354" y1="66" x2="498" y2="66" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="354" y1="82" x2="498" y2="82" stroke="#f3f4f6" stroke-width="1"/>
  <!-- Area fill -->
  <path d="M372,90 L418,70 L464,50 L464,100 L372,100 Z" fill="#1e3a8a" fill-opacity="0.12"/>
  <!-- Line -->
  <polyline points="372,90 418,70 464,50" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots -->
  <circle cx="372" cy="90" r="3.5" fill="white" stroke="#1e3a8a" stroke-width="2"/>
  <circle cx="418" cy="70" r="3.5" fill="white" stroke="#1e3a8a" stroke-width="2"/>
  <circle cx="464" cy="50" r="3.5" fill="white" stroke="#1e3a8a" stroke-width="2"/>
  <!-- R labels -->
  <text x="372" y="108" text-anchor="middle" font-size="7" fill="#9ca3af">R1</text>
  <text x="418" y="108" text-anchor="middle" font-size="7" fill="#9ca3af">R2</text>
  <text x="464" y="108" text-anchor="middle" font-size="7" fill="#9ca3af">R3</text>
  <!-- Values -->
  <text x="372" y="124" text-anchor="middle" font-size="8" fill="#1e3a8a" font-weight="700">45K</text>
  <text x="418" y="124" text-anchor="middle" font-size="8" fill="#1e3a8a" font-weight="700">67K</text>
  <text x="464" y="124" text-anchor="middle" font-size="8" fill="#1e3a8a" font-weight="700">84K</text>

  <!-- Platform card -->
  <rect x="174" y="165" width="335" height="94" rx="9" fill="white"/>
  <text x="184" y="180" font-size="8" fill="#6b7280" font-weight="500">Platform</text>
  <!-- TikTok -->
  <text x="184" y="197" font-size="7.5" fill="#111827" font-weight="600">TikTok</text>
  <rect x="222" y="191" width="248" height="5" rx="2.5" fill="#f3f4f6"/>
  <rect x="222" y="191" width="112" height="5" rx="2.5" fill="#111827"/>
  <text x="476" y="197" font-size="7" fill="#9ca3af" text-anchor="end">45%</text>
  <!-- Instagram -->
  <text x="184" y="214" font-size="7.5" fill="#D72C6D" font-weight="600">Instagram</text>
  <rect x="231" y="208" width="239" height="5" rx="2.5" fill="#f3f4f6"/>
  <rect x="231" y="208" width="76" height="5" rx="2.5" fill="#D72C6D"/>
  <text x="476" y="214" font-size="7" fill="#9ca3af" text-anchor="end">32%</text>
  <!-- Facebook -->
  <text x="184" y="231" font-size="7.5" fill="#2563EB" font-weight="600">Facebook</text>
  <rect x="228" y="225" width="242" height="5" rx="2.5" fill="#f3f4f6"/>
  <rect x="228" y="225" width="56" height="5" rx="2.5" fill="#2563EB"/>
  <text x="476" y="231" font-size="7" fill="#9ca3af" text-anchor="end">23%</text>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- FRONT WINDOW — KOL Table (bottom-left)            -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="0" y="152" width="357" height="280" rx="14" fill="white" stroke="#94a3b8" stroke-width="1" filter="url(#sh2)"/>

  <!-- Window chrome bar -->
  <path d="M0,166 Q0,152 14,152 L343,152 Q357,152 357,166 L357,178 L0,178 Z" fill="#1e293b"/>
  <circle cx="14" cy="165" r="4.5" fill="#f87171"/>
  <circle cx="27" cy="165" r="4.5" fill="#fbbf24"/>
  <circle cx="40" cy="165" r="4.5" fill="#4ade80"/>

  <!-- Inner gray bg (clipped to window) -->
  <g clip-path="url(#front-clip)">
    <rect x="1" y="178" width="355" height="253" fill="#f9fafb"/>

    <!-- KPI cards -->
    <rect x="11" y="185" width="104" height="40" rx="7" fill="white"/>
    <text x="21" y="198" font-size="7" fill="#9ca3af">Views</text>
    <text x="21" y="213" font-size="10" fill="#1e3a8a" font-weight="700">790K</text>

    <rect x="121" y="185" width="108" height="40" rx="7" fill="white"/>
    <text x="131" y="198" font-size="7" fill="#9ca3af">Engagement</text>
    <text x="131" y="213" font-size="10" fill="#1d4ed8" font-weight="700">70K</text>

    <rect x="235" y="185" width="109" height="40" rx="7" fill="white"/>
    <text x="245" y="198" font-size="7" fill="#9ca3af">Comments</text>
    <text x="245" y="213" font-size="10" fill="#60a5fa" font-weight="700">2.9K</text>

    <!-- Table -->
    <rect x="11" y="231" width="334" height="190" rx="7" fill="white"/>
    <!-- Table header -->
    <path d="M11,238 Q11,231 18,231 L338,231 Q345,231 345,238 L345,255 L11,255 Z" fill="#1e293b"/>
    <text x="22" y="246" font-size="7" fill="white" font-weight="500">Influencer</text>
    <text x="128" y="246" font-size="7" fill="white">Views</text>
    <text x="183" y="246" font-size="7" fill="white">Engagement</text>
    <text x="271" y="246" font-size="7" fill="#4ade80">Pos</text>
    <text x="298" y="246" font-size="7" fill="#9ca3af">Neu</text>
    <text x="325" y="246" font-size="7" fill="#f87171">Neg</text>

    <!-- Row 1: @alice — TikTok -->
    <!-- TikTok icon (black rect) -->
    <rect x="19" y="258" width="9" height="9" rx="1.5" fill="#111827"/>
    <text x="32" y="267" font-size="7.5" fill="#374151" font-weight="500">@alice</text>
    <text x="128" y="267" font-size="7.5" fill="#6b7280">320K</text>
    <text x="192" y="267" font-size="7.5" fill="#374151" font-weight="500">24K</text>
    <text x="271" y="267" font-size="7.5" fill="#16a34a" font-weight="500">620</text>
    <text x="298" y="267" font-size="7.5" fill="#9ca3af">280</text>
    <text x="325" y="267" font-size="7.5" fill="#ef4444" font-weight="500">102</text>
    <line x1="11" y1="272" x2="345" y2="272" stroke="#f3f4f6" stroke-width="0.5"/>

    <!-- Row 2: @bob — Instagram -->
    <rect x="12" y="273" width="333" height="25" fill="#f9fafb"/>
    <!-- IG icon (rounded square outline) -->
    <rect x="19" y="275" width="9" height="9" rx="2.5" fill="none" stroke="#D72C6D" stroke-width="1.4"/>
    <circle cx="23.5" cy="279.5" r="2" fill="none" stroke="#D72C6D" stroke-width="1.1"/>
    <text x="32" y="284" font-size="7.5" fill="#374151" font-weight="500">@bob</text>
    <text x="128" y="284" font-size="7.5" fill="#6b7280">180K</text>
    <text x="192" y="284" font-size="7.5" fill="#374151" font-weight="500">15K</text>
    <text x="271" y="284" font-size="7.5" fill="#16a34a" font-weight="500">380</text>
    <text x="298" y="284" font-size="7.5" fill="#9ca3af">190</text>
    <text x="325" y="284" font-size="7.5" fill="#ef4444" font-weight="500">73</text>
    <line x1="11" y1="298" x2="345" y2="298" stroke="#f3f4f6" stroke-width="0.5"/>

    <!-- Row 3: @carol — Facebook -->
    <!-- FB icon (blue rect + f) -->
    <rect x="19" y="301" width="9" height="9" rx="1.5" fill="#2563EB"/>
    <text x="23.5" y="309" text-anchor="middle" font-size="7" fill="white" font-weight="700">f</text>
    <text x="32" y="310" font-size="7.5" fill="#374151" font-weight="500">@carol</text>
    <text x="128" y="310" font-size="7.5" fill="#6b7280">290K</text>
    <text x="192" y="310" font-size="7.5" fill="#374151" font-weight="500">31K</text>
    <text x="271" y="310" font-size="7.5" fill="#16a34a" font-weight="500">840</text>
    <text x="298" y="310" font-size="7.5" fill="#9ca3af">320</text>
    <text x="325" y="310" font-size="7.5" fill="#ef4444" font-weight="500">140</text>
  </g>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- COMMENTS DRAWER (overlapping right)               -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="347" y="206" width="170" height="190" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#sh2)"/>

  <!-- Drawer header -->
  <path d="M347,218 Q347,206 359,206 L505,206 Q517,206 517,218 L517,232 L347,232 Z" fill="#1e293b"/>
  <text x="359" y="223" font-size="8.5" fill="white" font-weight="500">Comments</text>
  <text x="506" y="223" font-size="10" fill="#94a3b8" text-anchor="end">✕</text>

  <!-- Comment rows -->
  <rect x="357" y="240" width="22" height="12" rx="6" fill="#dcfce7"/>
  <text x="368" y="249" text-anchor="middle" font-size="6.5" fill="#15803d" font-weight="600">Pos</text>
  <text x="383" y="249" font-size="7.5" fill="#374151">Great content!</text>

  <rect x="357" y="257" width="22" height="12" rx="6" fill="#fee2e2"/>
  <text x="368" y="266" text-anchor="middle" font-size="6.5" fill="#dc2626" font-weight="600">Neg</text>
  <text x="383" y="266" font-size="7.5" fill="#374151">Too long video</text>

  <rect x="357" y="274" width="22" height="12" rx="6" fill="#dcfce7"/>
  <text x="368" y="283" text-anchor="middle" font-size="6.5" fill="#15803d" font-weight="600">Pos</text>
  <text x="383" y="283" font-size="7.5" fill="#374151">Love this brand</text>

  <rect x="357" y="291" width="22" height="12" rx="6" fill="#f3f4f6"/>
  <text x="368" y="300" text-anchor="middle" font-size="6.5" fill="#6b7280" font-weight="600">Neu</text>
  <text x="383" y="300" font-size="7.5" fill="#374151">It's okay</text>

  <rect x="357" y="308" width="22" height="12" rx="6" fill="#dcfce7"/>
  <text x="368" y="317" text-anchor="middle" font-size="6.5" fill="#15803d" font-weight="600">Pos</text>
  <text x="383" y="317" font-size="7.5" fill="#374151">Keep it up!</text>

</svg>
